<title>El Estrato Es el Mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --e1:#7A1F3D; --e2:#B33F52; --e3:#DE8A5A; --e4:#9BAFA6; --e5:#4C7A93; --e6:#243F63;
  --accent:#1D5C6E; --accent-soft:#DCE9EA;
  --ok:#3E7D5A; --warn:#B4791F; --crit:#A8324A; --null:#7C8B8E;
  --paper:#ECEFEE; --surface:#FFFFFF; --surface-2:#F5F7F6;
  --ink:#10222A; --ink-2:#3C5058; --ink-3:#6B7E84;
  --line:#D3DAD9; --line-2:#E4E9E8;
  --shadow:0 1px 2px rgba(16,34,42,.06),0 8px 24px rgba(16,34,42,.06);
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --e1:#9C3253; --e2:#C55668; --e3:#E09A66; --e4:#8FA79D; --e5:#5B90AA; --e6:#3D6089;
    --accent:#4FA3B5; --accent-soft:#17323A;
    --ok:#5DA37B; --warn:#D2A044; --crit:#D25470; --null:#6B7D82;
    --paper:#0C171B; --surface:#132329; --surface-2:#182D34;
    --ink:#E2ECEC; --ink-2:#A8BCC0; --ink-3:#7B9096;
    --line:#24404A; --line-2:#1C333B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --e1:#9C3253; --e2:#C55668; --e3:#E09A66; --e4:#8FA79D; --e5:#5B90AA; --e6:#3D6089;
  --accent:#4FA3B5; --accent-soft:#17323A;
  --ok:#5DA37B; --warn:#D2A044; --crit:#D25470; --null:#6B7D82;
  --paper:#0C171B; --surface:#132329; --surface-2:#182D34;
  --ink:#E2ECEC; --ink-2:#A8BCC0; --ink-3:#7B9096;
  --line:#24404A; --line-2:#1C333B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{overflow-x:clip;max-width:1280px;margin:0 auto;padding:0 24px 72px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── cabecera ── */
.masthead{border-bottom:1px solid var(--line);background:var(--surface)}
.masthead-in{max-width:1280px;margin:0 auto;padding:28px 24px 24px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:48px;align-items:end}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ramp{display:flex;height:13px;width:78px;border-radius:2px;overflow:hidden}
.ramp i{flex:1}
.masthead h1{font-size:clamp(27px,3.4vw,40px);line-height:1.04;font-weight:800;letter-spacing:-.03em}
.masthead h1 em{font-style:normal;color:var(--accent)}
.dek{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink-2);max-width:56ch;margin-top:12px}
.counters{min-width:0;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-2);
  border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.counter{background:var(--surface);padding:11px 13px}
.counter b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}
.counter span{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* ── secciones ── */
.sec{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px;
  padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec-head h2{font-size:19px;letter-spacing:-.02em}
.sec-head p{font-size:13px;color:var(--ink-3);margin-left:auto;max-width:48ch;text-align:right}

/* ── mapa ── */
.atlas{display:grid;grid-template-columns:190px 312px minmax(0,1fr);gap:18px;align-items:start;min-width:0}
.rail{display:flex;flex-direction:column;gap:16px}
.rail-grp{display:flex;flex-direction:column;gap:5px}
.rail-grp>.eyebrow{margin-bottom:3px}
.opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:4px;
  padding:6px 8px;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink-2);
  transition:background .12s,color .12s}
.opt:hover{background:var(--surface-2);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.opt .dot{width:8px;height:8px;border-radius:2px;flex:none;background:var(--ink-3)}
.opt[aria-pressed="true"] .dot{background:var(--accent)}
.seg{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;background:var(--surface);border:0;cursor:pointer;font:inherit;font-size:12px;
  font-weight:600;padding:7px 4px;color:var(--ink-3);transition:background .12s,color .12s}
.seg button:hover{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

.canvas{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
#map{display:block;width:100%;height:auto}
#map path{stroke:var(--surface);stroke-width:.55;stroke-linejoin:round;cursor:pointer;
  transition:opacity .1s}
#map path:hover{stroke:var(--ink);stroke-width:1.5}
#map path.on{stroke:var(--ink);stroke-width:2}
#map path.dim{opacity:.28}
.legend{gap:0}
.legend .eyebrow{display:block;margin-bottom:7px;font-size:10px;line-height:1.35}
.legend-bar{display:flex;height:9px;border-radius:2px;overflow:hidden}
.legend-bar i{flex:1}
.legend-ends{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-114%);
  background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:4px;font-size:12px;
  white-space:nowrap;z-index:5;transition:opacity .1s;line-height:1.35}
.tip b{font-family:var(--mono);font-weight:600}
.tip.show{opacity:1}

/* ── panel detalle ── */
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);overflow:hidden}
.rankbox{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.rank-head{padding:13px 15px 11px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.rank-head p{font-family:var(--serif);font-size:12px;line-height:1.45;color:var(--ink-3);margin-top:4px}
.panel-head{padding:13px 15px 12px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.panel-head .eyebrow{display:block;margin-bottom:3px}
.panel-head h3{font-size:16.5px;line-height:1.2}
.panel-head .sub{font-size:12px;color:var(--ink-3);margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chip.c-crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.chip.c-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.c-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.c-null{background:color-mix(in srgb,var(--null) 15%,transparent);color:var(--null)}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:8px 15px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.row .k{color:var(--ink-2)}
.row .v{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.row .v small{font-weight:400;color:var(--ink-3);font-size:10.5px;margin-left:2px}
.row+.row{box-shadow:-1px 0 0 var(--line-2)}
.bar{grid-column:1/-1;height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-top:1px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.panel-foot{padding:11px 15px;background:var(--surface-2);border-top:1px solid var(--line-2);
  font-family:var(--serif);font-size:12.5px;line-height:1.5;color:var(--ink-2)}

/* ── hipotesis ── */
.hyps{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.hyp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 14px;
  display:flex;flex-direction:column;gap:9px;border-left:3px solid var(--null)}
.hyp.v-ok{border-left-color:var(--ok)}
.hyp.v-part{border-left-color:var(--warn)}
.hyp.v-no{border-left-color:var(--crit)}
.hyp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hyp-id{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-3)}
.hyp h3{font-size:13.5px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.stats{display:flex;flex-direction:column;gap:3px;margin-top:1px}
.stat{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;font-size:11.5px}
.stat .m{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .s{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.stat .p{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stat .p.sig{color:var(--ok)}

/* ── contraste bivariado/controlado ── */
.contrast{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);padding:20px 22px;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:34px;align-items:center}
.cmp{display:flex;flex-direction:column;gap:15px}
.cmp-row{display:grid;grid-template-columns:106px minmax(0,1fr);gap:13px;align-items:center}
.cmp-row .lbl{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25}
.cmp-row .lbl small{display:block;font-weight:400;color:var(--ink-3);font-size:10.5px}
.track{position:relative;height:26px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.track i{position:absolute;left:0;top:0;height:100%;border-radius:3px}
.track i.a{background:var(--accent)}
.track i.b{background:var(--null)}
.track span{position:absolute;top:50%;transform:translateY(-50%);left:9px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:#fff}
.track span.out{left:auto;right:9px;color:var(--ink-2)}
.contrast .note{font-family:var(--serif);font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.contrast .note b{font-family:var(--sans);font-weight:700;color:var(--ink);font-size:13.5px}

/* ── temporal ── */
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.serie{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 14px 10px}
.serie-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.serie-top h3{font-size:13px;font-weight:600}
.serie-top .rng{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.serie svg{display:block;width:100%;height:auto}
.cav{font-family:var(--serif);font-size:11.5px;line-height:1.45;color:var(--ink-3);margin-top:7px}
#moran .cav{margin-top:4px;font-size:11px}

/* ── tabla ranking ── */
.tablewrap{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:470px;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th.r,td.r{text-align:right}
td{padding:9px 13px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr.on{background:var(--accent-soft)}
tbody tr:hover{background:var(--surface-2)}
td.rank{font-family:var(--mono);font-weight:600;color:var(--ink-3);width:34px}
td.name{font-weight:600}
td.name small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
td .mini{display:inline-block;width:44px;height:6px;border-radius:2px;background:var(--line-2);
  overflow:hidden;vertical-align:middle;margin-right:7px}
td .mini i{display:block;height:100%;background:var(--accent)}
.est{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:3px;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff}

/* ── notas ── */
.footnote{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:22px}
.footnote div{font-size:12.5px;line-height:1.55;color:var(--ink-3)}
.footnote .eyebrow{display:block;margin-bottom:5px;color:var(--ink-2)}
.footnote code{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}

@media (max-width:1080px){
  .atlas{grid-template-columns:170px minmax(0,1fr)}
  .side{grid-column:1/-1}
  .contrast{grid-template-columns:1fr;gap:22px}
}
@media (max-width:720px){
  .masthead-in{grid-template-columns:1fr;gap:20px}
  .atlas{grid-template-columns:1fr}
  .rail{flex-direction:row;flex-wrap:wrap;gap:12px}
  .rail-grp{flex:1 1 142px;min-width:0}
  .masthead h1{font-size:clamp(26px,7.2vw,40px)}
  .sec-head p{margin-left:0;text-align:left}
}
</style>
